name: Release
run-name: Release ${{ inputs.release_tag || github.ref_name }}

# One tag releases every Stonecutter node: one jar per game version range and loader.
on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing immutable v<semver> tag to publish
        required: true
        type: string

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.release.outputs.channel }}
      mod_version: ${{ steps.release.outputs.mod_version }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      tag: ${{ steps.release.outputs.tag }}
      nodes: ${{ steps.release.outputs.nodes }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.release_tag || github.ref_name }}

      - name: Validate release tag
        id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail

          tag="${RELEASE_TAG}"
          git rev-parse --verify "refs/tags/${tag}^{commit}" >/dev/null
          mod_version="${tag#v}"

          if [[ "${mod_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+-beta\.[1-9][0-9]*$ ]]; then
            channel="beta"
            prerelease="true"
          elif [[ "${mod_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            channel="release"
            prerelease="false"
          else
            echo "Only stable and -beta.N SemVer versions are publishable, got ${tag}" >&2
            exit 1
          fi

          configured_version="$(python3 -c 'import tomllib; print(tomllib.load(open("stonecutter.properties.toml", "rb"))["mod"]["version"])')"
          if [[ "${mod_version}" != "${configured_version}" ]]; then
            echo "Tag uses ${mod_version}, but this commit declares ${configured_version}" >&2
            exit 1
          fi

          {
            echo "channel=${channel}"
            echo "mod_version=${mod_version}"
            echo "prerelease=${prerelease}"
            echo "tag=${tag}"
            echo "nodes=$(python3 scripts/nodes.py)"
          } >> "${GITHUB_OUTPUT}"

  build:
    needs: metadata
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include: ${{ fromJSON(needs.metadata.outputs.nodes) }}
    name: build ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.metadata.outputs.tag }}

      - uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew :${{ matrix.node }}:build --configure-on-demand --console=plain
        env:
          VERSION: ${{ needs.metadata.outputs.mod_version }}+mc${{ matrix.minecraft }}

      - name: Create checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir dist
          artifact="$(find "versions/${{ matrix.node }}/build/libs" -maxdepth 1 -type f -name '*.jar' \
            ! -name '*-sources.jar' ! -name '*-javadoc.jar' ! -name '*-dev.jar' -print -quit)"
          test -n "${artifact}"
          cp "${artifact}" dist/
          (cd dist && sha256sum *.jar > "$(basename "${artifact}").sha256")

      - uses: actions/upload-artifact@v4
        with:
          name: jar-${{ matrix.node }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [metadata, build]
    runs-on: ubuntu-latest
    environment:
      name: publish-${{ needs.metadata.outputs.channel }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include: ${{ fromJSON(needs.metadata.outputs.nodes) }}
    name: publish ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.metadata.outputs.tag }}

      - uses: actions/download-artifact@v4
        with:
          name: jar-${{ matrix.node }}
          path: dist

      - name: Prepare release details
        id: details
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.mod_version }}
          RELEASES: ${{ toJSON(matrix.releases) }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path

          heading = f"## {os.environ['RELEASE_VERSION']}"
          lines = Path("CHANGELOG.md").read_text(encoding="utf-8").splitlines()
          matches = [i for i, line in enumerate(lines) if line == heading]
          if len(matches) != 1:
              raise SystemExit(f"Expected exactly one changelog entry for {heading}")
          start = matches[0]
          end = next((i for i in range(start + 1, len(lines)) if lines[i].startswith("## ")), len(lines))
          if not "\n".join(lines[start + 1:end]).strip():
              raise SystemExit(f"Empty changelog entry for {heading}")
          notes = Path(os.environ["RUNNER_TEMP"]) / "release-notes.md"
          notes.write_text("\n".join(lines[start:end]).strip() + "\n", encoding="utf-8")
          releases = json.loads(os.environ["RELEASES"])
          span = releases[0] if len(releases) == 1 else f"{releases[0]}–{releases[-1]}"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"notes={notes}\n")
              output.write(f"span={span}\n")
              output.write("game_versions<<EOF\n" + "\n".join(releases) + "\nEOF\n")
          PY
          echo "jar=$(ls dist/*.jar)" >> "${GITHUB_OUTPUT}"

      - name: Publish to Modrinth and CurseForge
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ vars.MODRINTH_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: ${{ vars.CURSEFORGE_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: ${{ steps.details.outputs.jar }}
          name: Phonon ${{ needs.metadata.outputs.mod_version }} for ${{ matrix.loader == 'fabric' && 'Fabric' || 'NeoForge' }} ${{ steps.details.outputs.span }}
          version: ${{ needs.metadata.outputs.mod_version }}+mc${{ matrix.minecraft }}.${{ matrix.loader }}
          version-type: ${{ needs.metadata.outputs.channel }}
          loaders: ${{ matrix.loader }}
          game-versions: ${{ steps.details.outputs.game_versions }}
          dependencies: ${{ matrix.loader == 'fabric' && 'fabric-api(required)' || '' }}
          changelog-file: ${{ steps.details.outputs.notes }}

  github-release:
    needs: [metadata, publish]
    runs-on: ubuntu-latest
    environment:
      name: publish-${{ needs.metadata.outputs.channel }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.metadata.outputs.tag }}

      - uses: actions/download-artifact@v4
        with:
          pattern: jar-*
          path: dist
          merge-multiple: true

      - name: Extract release notes
        id: notes
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.mod_version }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          heading = f"## {os.environ['RELEASE_VERSION']}"
          lines = Path("CHANGELOG.md").read_text(encoding="utf-8").splitlines()
          start = lines.index(heading)
          end = next((i for i in range(start + 1, len(lines)) if lines[i].startswith("## ")), len(lines))
          notes = Path(os.environ["RUNNER_TEMP"]) / "release-notes.md"
          notes.write_text("\n".join(lines[start:end]).strip() + "\n", encoding="utf-8")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"path={notes}\n")
          PY

      - name: Read current listing source
        uses: actions/checkout@v4
        with:
          ref: main
          path: listing

      - name: Sync Modrinth listing
        run: python3 listing/scripts/sync-modrinth.py
        env:
          MODRINTH_ID: ${{ vars.MODRINTH_ID }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Phonon ${{ needs.metadata.outputs.mod_version }}
          tag_name: ${{ needs.metadata.outputs.tag }}
          files: dist/*
          body_path: ${{ steps.notes.outputs.path }}
          prerelease: ${{ needs.metadata.outputs.prerelease }}
