# Mod metadata, and dependency versions for each node. Nodes are named `<minecraft>-<loader>`; a node's jar is
# published for every release in its mod.mc_releases, and each of those releases is boot-tested.
# Tables for releases without a node of their own (such as 1.21.2) hold what the boot test installs there.
mod.id = "phonon"
mod.name = "Phonon"
mod.version = "0.4.0-beta.1"
mod.group = "com.metrovoc.phonon"
mod.author = "metrovoc"
mod.license = "GPL-3.0"
mod.description = "Listen together in Minecraft. Play your music through speakers and boomboxes, in sync for every player."

deps.fabric_loader = "0.20.1"

