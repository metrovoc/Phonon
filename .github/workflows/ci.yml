name: CI

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
  pull_request:
  workflow_dispatch:

jobs:
  nodes:
    runs-on: ubuntu-latest
    outputs:
      nodes: ${{ steps.list.outputs.nodes }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: echo "nodes=$(python3 scripts/nodes.py)" >> "${GITHUB_OUTPUT}"

  build:
    needs: nodes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.nodes.outputs.nodes) }}
    name: build ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew :${{ matrix.node }}:build :${{ matrix.node }}:driverClasses --configure-on-demand --console=plain

      - name: Upload mod artifact
        uses: actions/upload-artifact@v4
        with:
          name: phonon-${{ matrix.node }}-${{ github.sha }}
          path: |
            versions/${{ matrix.node }}/build/libs/*.jar
            !**/*-sources.jar
          if-no-files-found: error
          retention-days: 14
