name: Release
run-name: Release ${{ inputs.release_tag || github.ref_name }}

on:
  push:
    tags:
      - 'v*\+mc*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing immutable v<semver>+mc<minecraft> tag to publish
        required: true
        type: string

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.release.outputs.channel }}
      java: ${{ steps.release.outputs.java }}
      minecraft: ${{ steps.release.outputs.minecraft }}
      mod_version: ${{ steps.release.outputs.mod_version }}
      platform_version: ${{ steps.release.outputs.platform_version }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.release_tag || github.ref_name }}

      - name: Validate release tag
        id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail

          tag="${RELEASE_TAG}"
          if [[ "${tag}" != v*+mc* ]]; then
            echo "Expected v<semver>+mc<minecraft>, got ${tag}" >&2
            exit 1
          fi
          git rev-parse --verify "refs/tags/${tag}^{commit}" >/dev/null

          mod_version="${tag#v}"
          mod_version="${mod_version%%+mc*}"
          minecraft="${tag##*+mc}"

          if [[ ! "${minecraft}" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "Invalid Minecraft version in tag: ${minecraft}" >&2
            exit 1
          fi

          if [[ "${mod_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+-alpha\.[1-9][0-9]*$ ]]; then
            channel="alpha"
            prerelease="true"
          elif [[ "${mod_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+-beta\.[1-9][0-9]*$ ]]; then
            channel="beta"
            prerelease="true"
          elif [[ "${mod_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            channel="release"
            prerelease="false"
          else
            echo "Only stable, -alpha.N, and -beta.N SemVer versions are publishable" >&2
            exit 1
          fi

          configured_minecraft="$(sed -n 's/^minecraft_version=//p' gradle.properties)"
          configured_version="$(sed -n 's/^version=//p' gradle.properties)"
          java_version="$(sed -n 's/^java_version=//p' gradle.properties)"

          if [[ "${minecraft}" != "${configured_minecraft}" ]]; then
            echo "Tag targets Minecraft ${minecraft}, but this commit targets ${configured_minecraft}" >&2
            exit 1
          fi
          if [[ "${mod_version}" != "${configured_version}" ]]; then
            echo "Tag uses ${mod_version}, but this commit declares ${configured_version}" >&2
            exit 1
          fi

          platform_version="${mod_version}+mc${minecraft}"
          {
            echo "channel=${channel}"
            echo "java=${java_version}"
            echo "minecraft=${minecraft}"
            echo "mod_version=${mod_version}"
            echo "platform_version=${platform_version}"
            echo "prerelease=${prerelease}"
            echo "tag=${tag}"
          } >> "${GITHUB_OUTPUT}"

  publish:
    needs: metadata
    runs-on: ubuntu-latest
    environment:
      name: publish-${{ needs.metadata.outputs.channel }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.metadata.outputs.tag }}

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ needs.metadata.outputs.java }}
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v4

      - name: Extract release notes
        id: notes
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.mod_version }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          heading = f"## {os.environ['RELEASE_VERSION']}"
          lines = Path("CHANGELOG.md").read_text(encoding="utf-8").splitlines()
          matches = [i for i, line in enumerate(lines) if line == heading]
          if len(matches) != 1:
              raise SystemExit(f"Expected exactly one changelog entry for {heading}")
          start = matches[0]
          end = next((i for i in range(start + 1, len(lines)) if lines[i].startswith("## ")), len(lines))
          if not "\n".join(lines[start + 1:end]).strip():
              raise SystemExit(f"Empty changelog entry for {heading}")
          notes = Path(os.environ["RUNNER_TEMP"]) / "release-notes.md"
          notes.write_text("\n".join(lines[start:end]).strip() + "\n", encoding="utf-8")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"path={notes}\n")
          PY

      - name: Build and test
        run: ./gradlew clean build --console=plain
        env:
          VERSION: ${{ needs.metadata.outputs.platform_version }}

      - name: Create checksum
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          artifact="$(find neoforge/build/libs -maxdepth 1 -type f -name '*.jar' \
            ! -name '*-sources.jar' ! -name '*-javadoc.jar' ! -name '*-dev.jar' -print -quit)"
          test -n "${artifact}"
          sha256sum "${artifact}" > "${artifact}.sha256"
          echo "path=${artifact}" >> "${GITHUB_OUTPUT}"

      - name: Publish to Modrinth and CurseForge
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ vars.MODRINTH_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: ${{ vars.CURSEFORGE_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: ${{ steps.artifact.outputs.path }}
          name: Phonon ${{ needs.metadata.outputs.mod_version }} for Minecraft ${{ needs.metadata.outputs.minecraft }}
          version: ${{ needs.metadata.outputs.platform_version }}
          version-type: ${{ needs.metadata.outputs.channel }}
          loaders: neoforge
          game-versions: ${{ needs.metadata.outputs.minecraft }}
          changelog-file: ${{ steps.notes.outputs.path }}

      - name: Read current listing source
        if: needs.metadata.outputs.channel != 'alpha'
        uses: actions/checkout@v4
        with:
          ref: main
          path: listing

      - name: Sync Modrinth listing
        if: needs.metadata.outputs.channel != 'alpha'
        run: python3 listing/scripts/sync-modrinth.py
        env:
          MODRINTH_ID: ${{ vars.MODRINTH_ID }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Phonon ${{ needs.metadata.outputs.mod_version }} for Minecraft ${{ needs.metadata.outputs.minecraft }}
          tag_name: ${{ needs.metadata.outputs.tag }}
          files: |
            ${{ steps.artifact.outputs.path }}
            ${{ steps.artifact.outputs.path }}.sha256
          body_path: ${{ steps.notes.outputs.path }}
          prerelease: ${{ needs.metadata.outputs.prerelease }}
